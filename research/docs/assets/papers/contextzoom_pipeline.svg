<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="1100" height="650" fill="url(#bgGrad)" />

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="1100" y2="100" /><line x1="0" y1="200" x2="1100" y2="200" />
    <line x1="0" y1="300" x2="1100" y2="300" /><line x1="0" y1="400" x2="1100" y2="400" />
    <line x1="0" y1="500" x2="1100" y2="500" /><line x1="200" y1="0" x2="200" y2="650" />
    <line x1="400" y1="0" x2="400" y2="650" /><line x1="600" y1="0" x2="600" y2="650" />
    <line x1="800" y1="0" x2="800" y2="650" />
  </g>

  <g transform="translate(50, 35)">
    <rect x="0" y="0" width="38" height="38" rx="8" fill="#8b5cf6" />
    <text x="19" y="25" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">⚡</text>
    <text x="50" y="20" fill="#f8fafc" font-size="22" font-weight="bold">ContextZoom: The Visual Myopia Dilemma</text>
    <text x="50" y="38" fill="#94a3b8" font-size="13">Sun et al. (Tsinghua / Shanghai AI Lab) — arXiv Jan 2025</text>
  </g>

  <g transform="translate(50, 115)">
    <rect width="280" height="390" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="42" rx="12" fill="#1e293b"/>
    <text x="20" y="26" fill="#38bdf8" font-size="14" font-weight="bold">1. The Zoom Trap</text>
    <foreignObject x="20" y="58" width="240" height="315">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #cbd5e1; font-size: 13px; line-height: 1.55;">
        <p style='margin: 0 0 8px 0;'>• Model zooms into high-detail crop</p><p style='margin: 0 0 8px 0;'>• Pixels become razor sharp</p><p style='margin: 0 0 8px 0;'>• Fine object recognition improves</p><p style='margin: 0 0 8px 0;'>• BUT: Surrounding landmarks vanish</p>
      </div>
    </foreignObject>
  </g>

  <line x1="340" y1="310" x2="400" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(410, 115)">
    <rect width="280" height="390" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.8" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="42" rx="12" fill="#8b5cf6" fill-opacity="0.2"/>
    <text x="20" y="26" fill="#f8fafc" font-size="14" font-weight="bold">2. Visual Myopia</text>
    <foreignObject x="20" y="58" width="240" height="315">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #cbd5e1; font-size: 13px; line-height: 1.55;">
        <p style='margin: 0 0 8px 0;'>• Model loses global coordinate frame</p><p style='margin: 0 0 8px 0;'>• Direction reasoning drops by up to 35%</p><p style='margin: 0 0 8px 0;'>• Cannot answer 'Which object is further North?'</p><p style='margin: 0 0 8px 0;'>• Cross-object distances are hallucinated</p>
      </div>
    </foreignObject>
  </g>

  <line x1="700" y1="310" x2="760" y2="310" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <g transform="translate(770, 115)">
    <rect width="280" height="390" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="280" height="42" rx="12" fill="#10b981" fill-opacity="0.15"/>
    <text x="20" y="26" fill="#34d399" font-size="14" font-weight="bold">3. Harmonized Solution</text>
    <foreignObject x="20" y="58" width="240" height="315">
      <div xmlns="http://www.w3.org/1999/xhtml" style="color: #cbd5e1; font-size: 13px; line-height: 1.55;">
        <p style='margin: 0 0 8px 0;'>• Re-injects boundary coordinates into crop</p><p style='margin: 0 0 8px 0;'>• Enforces cross-attention with overview</p><p style='margin: 0 0 8px 0;'>• Mitigates relational drop</p><p style='margin: 0 0 8px 0;'>• Independent proof of our core thesis!</p>
      </div>
    </foreignObject>
  </g>

  <g transform="translate(50, 535)">
    <rect width="1000" height="75" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="25" y="28" fill="#38bdf8" font-size="13" font-weight="bold">DIRECT TAKEAWAY FOR OUR RESEARCH PAPER:</text>
    <text x="25" y="50" fill="#e2e8f0" font-size="13">Crucial theoretical citation: Independently proves our core thesis that zooming helps fine perception but sabotages spatial relations without global anchoring.</text>
  </g>
</svg>