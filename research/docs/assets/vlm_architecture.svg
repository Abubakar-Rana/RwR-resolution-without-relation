<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" style="background-color: #0b0f19; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Filters for Glow / Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Marker Arrowheads -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#06b6d4" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Grid lines pattern overlay -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="675" x2="1200" y2="675" />
    <line x1="150" y1="0" x2="150" y2="750" />
    <line x1="300" y1="0" x2="300" y2="750" />
    <line x1="450" y1="0" x2="450" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="750" y1="0" x2="750" y2="750" />
    <line x1="900" y1="0" x2="900" y2="750" />
    <line x1="1050" y1="0" x2="1050" y2="750" />
  </g>

  <!-- Top Title Header -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="36" height="36" rx="8" fill="url(#cyanGrad)" />
    <text x="18" y="24" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">🛰️</text>
    <text x="50" y="22" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="-0.5px">Dual-Stream Anchored VLM Architecture (RwR Solution)</text>
    <text x="50" y="38" fill="#94a3b8" font-size="13">Resolving Resolution-without-Relation via Holistic Spatial Anchoring &amp; Uncertainty-Gated Fast Routing</text>
  </g>

  <!-- SECTION 1: INPUT MODALITY (Left Column) -->
  <g transform="translate(50, 110)">
    <!-- Canvas Card -->
    <rect width="210" height="250" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="12" y="12" width="186" height="130" rx="8" fill="#0f172a" stroke="#475569" stroke-dasharray="3,3"/>
    
    <!-- Mini Satellite Image Mockup -->
    <circle cx="80" cy="65" r="28" fill="#0369a1" opacity="0.4" />
    <path d="M 30 110 Q 80 40 140 120" stroke="#0ea5e9" stroke-width="2" fill="none" opacity="0.6"/>
    <rect x="105" y="70" width="18" height="12" rx="2" fill="#e2e8f0" opacity="0.8"/>
    <rect x="135" y="55" width="22" height="14" rx="2" fill="#e2e8f0" opacity="0.8"/>
    <circle cx="114" cy="76" r="2" fill="#ef4444"/>
    <circle cx="146" cy="62" r="2" fill="#ef4444"/>

    <text x="105" y="165" fill="#f8fafc" font-size="14" font-weight="600" text-anchor="middle">Ultra-High-Res Canvas</text>
    <text x="105" y="185" fill="#38bdf8" font-size="12" font-weight="500" text-anchor="middle">8,192 x 8,192 Pixels</text>
    <text x="105" y="205" fill="#94a3b8" font-size="11" text-anchor="middle">Gigapixel Earth Observation</text>
    <text x="105" y="222" fill="#64748b" font-size="10" text-anchor="middle">(Sub-100px Targets Present)</text>

    <!-- Query Card -->
    <g transform="translate(0, 270)">
      <rect width="210" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#475569"/>
      <text x="28" y="33" fill="#ffffff" font-size="14" text-anchor="middle">💬</text>
      <text x="50" y="32" fill="#f8fafc" font-size="14" font-weight="600">User Query</text>
      
      <rect x="14" y="52" width="182" height="60" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="22" y="72" fill="#cbd5e1" font-size="11">"Are the oil tanks located</text>
      <text x="22" y="88" fill="#cbd5e1" font-size="11">north-west of the main runway</text>
      <text x="22" y="104" fill="#cbd5e1" font-size="11">occupied or empty?"</text>

      <rect x="14" y="122" width="85" height="22" rx="4" fill="#0369a1" opacity="0.3"/>
      <text x="56" y="137" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Spatial Intent</text>

      <rect x="105" y="122" width="91" height="22" rx="4" fill="#7c3aed" opacity="0.3"/>
      <text x="150" y="137" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">Fine Perception</text>

      <text x="105" y="162" fill="#64748b" font-size="10" text-anchor="middle">Joint Relational &amp; Texture Task</text>
    </g>
  </g>

  <!-- CONNECTOR LINES FROM INPUT -->
  <path d="M 260 210 L 320 210" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 260 250 C 290 250, 290 350, 320 350" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 260 470 C 290 470, 290 530, 320 530" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- SECTION 2: DUAL PROCESSING STREAMS (Middle Column 1) -->
  
  <!-- STREAM A: GLOBAL OVERVIEW ANCHOR -->
  <g transform="translate(325, 120)">
    <rect width="250" height="150" rx="12" fill="#1e293b" stroke="#06b6d4" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="25" r="14" fill="#06b6d4" />
    <text x="25" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1</text>
    <text x="48" y="29" fill="#f8fafc" font-size="14" font-weight="700">Global Overview Stream</text>
    <text x="48" y="45" fill="#38bdf8" font-size="11" font-weight="500">Holistic Spatial Anchor (448px)</text>

    <!-- Details -->
    <rect x="15" y="58" width="220" height="75" rx="8" fill="#0f172a"/>
    <text x="25" y="78" fill="#94a3b8" font-size="11">✓ Preserves 2D Global Topology</text>
    <text x="25" y="96" fill="#94a3b8" font-size="11">✓ Prevents "Visual Myopia" (-4.5 pp)</text>
    <text x="25" y="114" fill="#38bdf8" font-size="11" font-weight="600">Tokens: 576 | Latency: 3.0s</text>
  </g>

  <!-- STREAM B: FAST OPEN-VOCAB GROUNDING DETECTOR -->
  <g transform="translate(325, 295)">
    <rect width="250" height="175" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="25" r="14" fill="#f59e0b" />
    <text x="25" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">Fast Grounding Engine</text>
    <text x="48" y="44" fill="#fbbf24" font-size="11" font-weight="500">YOLO-World-v2 / Grounding DINO</text>

    <rect x="15" y="56" width="220" height="102" rx="8" fill="#0f172a"/>
    <text x="25" y="76" fill="#fca5a5" font-size="11">✗ Replaces 66% LLM Null Boxes</text>
    <text x="25" y="94" fill="#86efac" font-size="11">✓ Open-Vocab Class Conditioning</text>
    <text x="25" y="112" fill="#86efac" font-size="11">✓ 15% Overlap Padding (Seam Fix)</text>
    <text x="25" y="132" fill="#fbbf24" font-size="11" font-weight="600">Latency: 19ms - 40ms (&lt;1% total)</text>
  </g>

  <!-- STREAM C: ACTIVE ZOOM & LOCAL CROP EXTRACTION -->
  <g transform="translate(325, 495)">
    <rect width="250" height="165" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="25" r="14" fill="#a855f7" />
    <text x="25" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">Active Zoom Stream</text>
    <text x="48" y="44" fill="#c084fc" font-size="11" font-weight="500">Sub-Pixel Detail Crops (1024px)</text>

    <rect x="15" y="56" width="220" height="92" rx="8" fill="#0f172a"/>
    <text x="25" y="76" fill="#94a3b8" font-size="11">✓ Extracts Candidate Targets</text>
    <text x="25" y="94" fill="#94a3b8" font-size="11">✓ Set-of-Mark Numeric Overlays [1],[2]</text>
    <text x="25" y="112" fill="#94a3b8" font-size="11">✓ Fine Perception Gain (+4.1 pp)</text>
    <text x="25" y="130" fill="#c084fc" font-size="11" font-weight="600">Visual Crops: k = 2 to 4</text>
  </g>

  <!-- CONNECTORS FROM PROCESSING TO UNIFICATION -->
  <path d="M 575 195 L 640 280" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 575 380 L 640 340" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 575 570 L 640 400" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>

  <!-- SECTION 3: MULTIMODAL CONNECTOR & COMPRESSION (Middle Column 2) -->
  <g transform="translate(645, 230)">
    <rect width="230" height="270" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="25" r="14" fill="#3b82f6" />
    <text x="25" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4</text>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">Unified Connector</text>
    <text x="48" y="44" fill="#60a5fa" font-size="11" font-weight="500">Pixel Shuffle &amp; 2D-RoPE</text>

    <rect x="14" y="58" width="202" height="195" rx="8" fill="#0f172a"/>
    
    <text x="24" y="78" fill="#38bdf8" font-weight="600" font-size="11">Pixel Shuffle 2x2 Downsample</text>
    <text x="24" y="94" fill="#94a3b8" font-size="10">• 75% Visual Token Reduction</text>
    <text x="24" y="108" fill="#94a3b8" font-size="10">• Invertible spatial packaging</text>

    <line x1="24" y1="118" x2="202" y2="118" stroke="#334155" stroke-width="1"/>

    <text x="24" y="136" fill="#a855f7" font-weight="600" font-size="11">Multi-Modal 2D-RoPE</text>
    <text x="24" y="152" fill="#94a3b8" font-size="10">• Factorized (x, y) coordinates</text>
    <text x="24" y="166" fill="#94a3b8" font-size="10">• Continuous metric distance</text>

    <line x1="24" y1="176" x2="202" y2="176" stroke="#334155" stroke-width="1"/>

    <text x="24" y="194" fill="#10b981" font-weight="600" font-size="11">Sequence Packing (TokenPack)</text>
    <text x="24" y="210" fill="#94a3b8" font-size="10">• Zero padding token compute</text>
    <text x="24" y="224" fill="#94a3b8" font-size="10">• 2.4x throughput serving</text>
  </g>

  <!-- CONNECTOR TO DECISION ROUTER -->
  <path d="M 875 365 L 920 365" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SECTION 4: UNCERTAINTY GATED ROUTER & LLM (Right Column) -->
  <g transform="translate(925, 120)">
    <!-- Gating Router -->
    <rect width="225" height="190" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="25" r="14" fill="#10b981" />
    <text x="25" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5</text>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">Adaptive Router</text>
    <text x="48" y="44" fill="#34d399" font-size="11" font-weight="500">Logit Margin Gating (M = y1 - y2)</text>

    <rect x="14" y="58" width="197" height="118" rx="8" fill="#0f172a"/>
    <text x="24" y="78" fill="#34d399" font-weight="600" font-size="11">Fast Path (M ≥ τ):</text>
    <text x="24" y="94" fill="#94a3b8" font-size="10">• Overview only (3.0s)</text>
    <text x="24" y="108" fill="#94a3b8" font-size="10">• Answers ~70% of questions</text>

    <text x="24" y="130" fill="#f87171" font-weight="600" font-size="11">Zoom Path (M &lt; τ):</text>
    <text x="24" y="146" fill="#94a3b8" font-size="10">• Escalate to Dual-Stream (4.2s)</text>
    <text x="24" y="160" fill="#38bdf8" font-size="10" font-weight="600">• Overall Compute Cut: &gt;70%</text>
  </g>

  <!-- LLM BACKBONE & REASONING -->
  <g transform="translate(925, 340)">
    <rect width="225" height="230" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2" filter="url(#cardShadow)"/>
    <circle cx="25" cy="25" r="14" fill="#f43f5e" />
    <text x="25" y="30" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">6</text>
    <text x="48" y="28" fill="#f8fafc" font-size="14" font-weight="700">VLM Decoder</text>
    <text x="48" y="44" fill="#fb7185" font-size="11" font-weight="500">Qwen2.5-VL / InternVL-2.5</text>

    <rect x="14" y="56" width="197" height="158" rx="8" fill="#0f172a"/>
    <text x="24" y="76" fill="#f8fafc" font-weight="600" font-size="11">Autoregressive CoT Output</text>
    <text x="24" y="94" fill="#cbd5e1" font-size="10">1. Reads Set-of-Marks [1], [2]</text>
    <text x="24" y="110" fill="#cbd5e1" font-size="10">2. Anchors to Global Runway</text>
    <text x="24" y="126" fill="#cbd5e1" font-size="10">3. Emits Verified Grounding</text>

    <rect x="24" y="140" width="177" height="60" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="32" y="158" fill="#86efac" font-size="10" font-weight="700">Final Decision Output:</text>
    <text x="32" y="174" fill="#ffffff" font-size="10">"Oil tanks [1] north-west are</text>
    <text x="32" y="190" fill="#38bdf8" font-size="10" font-weight="600">FULL (98.4% Confidence)"</text>
  </g>

  <!-- BOTTOM KPI & METRIC BANNER -->
  <g transform="translate(50, 680)">
    <rect width="1100" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="30" fill="#94a3b8" font-size="12" font-weight="600">EMPIRICAL BENCHMARK GAINS (XLRS-Bench-Lite):</text>
    
    <text x="380" y="30" fill="#38bdf8" font-size="12" font-weight="700">Perception: 46.7% (+4.1 pp)</text>
    <circle cx="560" cy="26" r="3" fill="#475569"/>

    <text x="590" y="30" fill="#a855f7" font-size="12" font-weight="700">Relations: 46.2% (+6.2 pp)</text>
    <circle cx="770" cy="26" r="3" fill="#475569"/>

    <text x="800" y="30" fill="#10b981" font-size="12" font-weight="700">Overall: 48.5% - 51.2% (Oracle Bound)</text>
    <circle cx="1030" cy="26" r="3" fill="#475569"/>

    <text x="1050" y="30" fill="#fbbf24" font-size="12" font-weight="700">Latency: 4.2s (-75%)</text>
  </g>
</svg>
